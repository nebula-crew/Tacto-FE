<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1000" viewBox="0 0 390 1000" role="img" aria-labelledby="title description">
  <title id="title">Tacto 메인 화면</title>
  <desc id="description">Figma에서 카드, 아이콘, 문구를 각각 선택할 수 있는 메인 화면 디자인</desc>
  <rect id="screen-background" width="390" height="1000" fill="#F2F4F5"/>

  <g id="header">
    <g id="braille-logo" fill="#19875B">
      <circle cx="25" cy="48" r="3"/><circle cx="34" cy="48" r="3"/><circle cx="43" cy="48" r="3"/>
      <circle cx="25" cy="57" r="3"/><circle cx="34" cy="57" r="3"/><circle cx="43" cy="57" r="3"/>
      <circle cx="25" cy="66" r="3"/><circle cx="34" cy="66" r="3"/><circle cx="43" cy="66" r="3"/>
    </g>
    <text id="brand" x="57" y="66" fill="#171717" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="700">Tacto</text>
    <text id="guide-link" x="310" y="62" fill="#68716D" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="13">이용 안내</text>
  </g>

  <g id="intro-copy" transform="translate(0 6)" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
    <text id="intro-eyebrow" x="22" y="119" fill="#68716D" font-size="12">한 장으로 살펴보는 보행 환경</text>
    <g id="intro-title" fill="#171717" font-size="30" font-weight="700">
      <text x="22" y="164">오늘의 길,</text>
      <text x="22" y="206">함께 확인해 볼까요?</text>
    </g>
    <text id="intro-description" x="22" y="245" fill="#68716D" font-size="14">점자블록과 주변 길을 한 장에 담아 주세요.</text>
  </g>

  <g id="photo-actions" transform="translate(0 12)" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
    <g id="camera-card">
      <rect x="22" y="277" width="167" height="160" rx="22" fill="#FFFFFF"/>
      <g id="camera-icon" fill="none" stroke="#19875B" stroke-width="2.5" stroke-linejoin="round">
        <rect x="45" y="313" width="32" height="24" rx="5"/>
        <path d="M55 313 L55 309 Q55 307 58 307 L65 307 Q68 307 68 309 L68 313"/>
        <circle cx="61" cy="325" r="6"/>
      </g>
      <text id="camera-title" x="44" y="376" fill="#171717" font-size="18" font-weight="600">사진 촬영</text>
      <text id="camera-detail" x="44" y="400" fill="#68716D" font-size="11">지금 보고 있는 길 찍기</text>
    </g>
    <g id="gallery-card">
      <rect x="201" y="277" width="167" height="160" rx="22" fill="#FFFFFF"/>
      <g id="gallery-icon" fill="none" stroke="#19875B" stroke-width="2.5" stroke-linejoin="round">
        <rect x="224" y="313" width="32" height="24" rx="5"/>
        <circle cx="247" cy="320" r="2.5" fill="#19875B" stroke="none"/>
        <path d="M228 333 L237 324 L246 333"/>
      </g>
      <text id="gallery-title" x="223" y="376" fill="#171717" font-size="18" font-weight="600">갤러리</text>
      <text id="gallery-detail" x="223" y="400" fill="#68716D" font-size="11">저장된 사진 불러오기</text>
    </g>
  </g>

  <g id="photo-tips" transform="translate(0 18)" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
    <rect id="tips-card" x="22" y="456" width="346" height="185" rx="22" fill="#FFFFFF"/>
    <text id="tips-title" x="44" y="497" fill="#171717" font-size="18" font-weight="600">이렇게 담으면 좋아요</text>
    <g id="tip-one">
      <circle cx="55" cy="537" r="11" fill="#EAF7F0"/>
      <path d="M50 537 L54 541 L61 533" fill="none" stroke="#19875B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="540" fill="#68716D" font-size="14">블록만 확대하지 말고 주변 동선과</text>
      <text x="76" y="564" fill="#68716D" font-size="14">연결부까지 함께 담아 주세요.</text>
    </g>
    <g id="tip-two">
      <circle cx="55" cy="601" r="11" fill="#EAF7F0"/>
      <circle cx="55" cy="601" r="5" fill="none" stroke="#19875B" stroke-width="2"/>
      <text x="76" y="605" fill="#68716D" font-size="14">밝은 곳에서 흔들림 없이 촬영해 주세요.</text>
    </g>
  </g>

  <g id="recent-inspection-button" transform="translate(0 24)" font-family="Malgun Gothic, Noto Sans KR, sans-serif">
    <rect x="22" y="665" width="346" height="56" rx="14" fill="#FFFFFF" stroke="#7BE1B0" stroke-width="2"/>
    <text x="195" y="699" text-anchor="middle" fill="#171717" font-size="15" font-weight="700">최근 검사 결과 살펴보기</text>
  </g>
</svg>

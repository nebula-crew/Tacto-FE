<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title description">
  <title id="title">tacto 이용안내 첫 화면</title>
  <desc id="description">Figma에서 그룹별로 선택해 수정할 수 있는 첫 번째 안내 화면</desc>
  <rect id="screen-background" width="390" height="844" fill="#F2F4F5"/>

  <g id="header" transform="translate(0 30)">
    <g id="braille-logo" fill="#19875B">
      <circle cx="25" cy="48" r="3"/><circle cx="34" cy="48" r="3"/><circle cx="43" cy="48" r="3"/>
      <circle cx="25" cy="57" r="3"/><circle cx="34" cy="57" r="3"/><circle cx="43" cy="57" r="3"/>
      <circle cx="25" cy="66" r="3"/><circle cx="34" cy="66" r="3"/><circle cx="43" cy="66" r="3"/>
    </g>
    <text id="brand-name" x="57" y="66" fill="#171717" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="700">Tacto</text>
    <text id="skip-label" x="311" y="63" fill="#68716D" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="13">건너뛰기</text>
  </g>

  <g id="onboarding-card">
    <rect id="card-shadow" x="21" y="110" width="349" height="546" rx="22" fill="#DDE9E2" opacity="0.38"/>
    <rect id="card-background" x="19" y="106" width="353" height="546" rx="22" fill="#FFFFFF"/>
    <text id="eyebrow" x="41" y="155" fill="#68716D" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="12">길 위의 작은 불편을 발견하는 방법</text>
    <g id="main-title" fill="#171717" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="28" font-weight="700">
      <text x="41" y="207">매일 걷는 길을</text>
      <text x="41" y="246">조금 더 안전하게</text>
    </g>
    <g id="body-copy" fill="#68716D" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="14">
      <text x="41" y="305">점자블록의 연결과 배치를 살펴보세요.</text>
      <text x="41" y="334">사진 한 장으로 확인을 시작할 수 있어요.</text>
    </g>

    <g id="illustration">
      <rect id="illustration-background" x="45" y="368" width="303" height="236" rx="19" fill="#F3F8F5"/>
      <g id="illustration-content" transform="translate(0 21)">
      <circle id="illustration-halo" cx="195" cy="465" r="91" fill="#FFFFFF"/>
      <g id="paving-tiles" transform="rotate(-12 195 464)">
        <rect x="124" y="393" width="44" height="44" rx="4" fill="#E4E8E6"/>
        <rect x="173" y="393" width="44" height="44" rx="4" fill="#E4BF56"/>
        <rect x="222" y="393" width="44" height="44" rx="4" fill="#E4E8E6"/>
        <rect x="124" y="442" width="44" height="44" rx="4" fill="#E4E8E6"/>
        <rect x="173" y="442" width="44" height="44" rx="4" fill="#E4BF56"/>
        <rect x="222" y="442" width="44" height="44" rx="4" fill="#E4E8E6"/>
        <rect x="124" y="491" width="44" height="44" rx="4" fill="#E4E8E6"/>
        <rect x="173" y="491" width="44" height="44" rx="4" fill="#E4BF56"/>
        <rect x="222" y="491" width="44" height="44" rx="4" fill="#E4E8E6"/>
        <g id="linear-ridges" fill="#B28B30">
          <rect x="181" y="398" width="5" height="34" rx="2"/><rect x="191" y="398" width="5" height="34" rx="2"/><rect x="201" y="398" width="5" height="34" rx="2"/>
          <rect x="181" y="496" width="5" height="34" rx="2"/><rect x="191" y="496" width="5" height="34" rx="2"/><rect x="201" y="496" width="5" height="34" rx="2"/>
        </g>
        <g id="warning-dots" fill="#B28B30">
          <circle cx="183" cy="452" r="3"/><circle cx="195" cy="452" r="3"/><circle cx="207" cy="452" r="3"/>
          <circle cx="183" cy="464" r="3"/><circle cx="195" cy="464" r="3"/><circle cx="207" cy="464" r="3"/>
          <circle cx="183" cy="476" r="3"/><circle cx="195" cy="476" r="3"/><circle cx="207" cy="476" r="3"/>
        </g>
      </g>
      <g id="floating-location-pin">
        <ellipse id="pin-shadow" cx="195" cy="468" rx="11" ry="4" fill="#19875B" opacity="0.18"/>
        <circle id="pin-head" cx="195" cy="433" r="15" fill="#19875B"/>
        <path id="pin-tip" d="M185 443 L205 443 L195 457 Z" fill="#19875B"/>
        <circle id="pin-center" cx="195" cy="433" r="5" fill="#FFFFFF"/>
      </g>
      </g>
    </g>
  </g>

  <g id="slide-navigation" transform="translate(0 42)">
    <circle id="previous-button" cx="107" cy="643" r="18" fill="#FFFFFF" opacity="0.3"/>
    <path id="previous-arrow" d="M111 638 L106 643 L111 648" fill="none" stroke="#19875B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <rect id="active-dot" x="150" y="640" width="23" height="7" rx="3.5" fill="#3ECF8E"/>
    <circle id="second-dot" cx="193" cy="643.5" r="3.5" fill="#D9E2DD"/>
    <circle id="third-dot" cx="224" cy="643.5" r="3.5" fill="#D9E2DD"/>
    <circle id="next-button" cx="283" cy="643" r="18" fill="#3ECF8E"/>
    <path id="next-arrow" d="M279 638 L284 643 L279 648" fill="none" stroke="#19875B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text id="swipe-hint" x="195" y="700" text-anchor="middle" fill="#68716D" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="12">1 / 3 · 좌우로 넘겨보세요</text>
  </g>
</svg>
